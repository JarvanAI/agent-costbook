name: Docker OCI Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_ghcr:
        description: 'Publish tagged container image to GHCR (requires git tag ref)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build OCI Image and Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Early tag guard and version verification
        env:
          INPUT_PUBLISH_GHCR: ${{ inputs.publish_ghcr }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # If manual publish was requested, ensure the ref is a valid release tag; refuse clearly otherwise
          if [ "$INPUT_PUBLISH_GHCR" = "true" ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Publishing to GHCR was requested via workflow_dispatch, but ref '$GITHUB_REF' is not a release tag (refs/tags/v*). Manual publish requires an explicit version tag ref."
            exit 1
          fi

          # If triggered on a git tag, verify that the git tag version strictly matches pyproject.toml
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            python3 - "$TAG_VER" <<'EOF'
          import sys, tomllib
          from pathlib import Path

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          pkg_ver = data["project"]["version"]
          tag_ver = sys.argv[1]
          if tag_ver != pkg_ver:
              print(f"::error::Git tag '{tag_ver}' does not match pyproject.toml version '{pkg_ver}'")
              sys.exit(1)
          print(f"Verified git tag '{tag_ver}' matches pyproject.toml version '{pkg_ver}'")
          EOF
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OCI container image
        run: |
          docker build -t agent-costbook:test .

      - name: Run container in read-only mode for HTTP smoke test
        run: |
          docker run -d \
            --name smoke-app \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -p 8080:8080 \
            -e PORT=8080 \
            agent-costbook:test

      - name: Verify anonymous HTTP contract
        run: |
          python3 - <<'PYREADY'
          import time
          from urllib.error import URLError
          from urllib.request import urlopen
          for attempt in range(30):
              try:
                  with urlopen("http://127.0.0.1:8080/health", timeout=2) as response:
                      assert response.status == 200
                  break
              except (URLError, ConnectionResetError):
                  time.sleep(0.5)
          else:
              raise SystemExit("Container did not start within 15 seconds")
          PYREADY
          python3 scripts/check-public-service.py http://127.0.0.1:8080

      - name: Stop smoke-app container
        if: always()
        run: |
          docker logs smoke-app
          docker stop smoke-app
          docker rm smoke-app

      - name: Save smoke-tested OCI image artifact
        run: |
          docker save agent-costbook:test -o /tmp/agent-costbook-image.tar

      - name: Upload smoke-tested OCI image artifact
        uses: actions/upload-artifact@v4
        with:
          name: oci-image
          path: /tmp/agent-costbook-image.tar
          retention-days: 1

  publish-ghcr:
    name: Publish to GitHub Container Registry (GHCR)
    needs: build-and-smoke
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_ghcr == true && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download smoke-tested OCI image artifact
        uses: actions/download-artifact@v4
        with:
          name: oci-image
          path: /tmp

      - name: Load smoke-tested image
        run: |
          docker load -i /tmp/agent-costbook-image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push smoke-tested image to GHCR
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          # Normalize repository name from GITHUB_REPOSITORY environment variable to lowercase
          REPO_LOWER=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_LOWER}"

          docker tag agent-costbook:test "${IMAGE_NAME}:${TAG_VER}"
          docker tag agent-costbook:test "${IMAGE_NAME}:latest"

          docker push "${IMAGE_NAME}:${TAG_VER}"
          docker push "${IMAGE_NAME}:latest"

          echo "=========================================================================="
          echo "Published ${IMAGE_NAME}:${TAG_VER} and ${IMAGE_NAME}:latest to GHCR."
          echo "NOTE: Public anonymous pulls require verifying package visibility settings."
          echo "Navigate to GitHub -> Packages -> agent-costbook -> Package settings -> Change visibility to Public."
          echo "=========================================================================="
