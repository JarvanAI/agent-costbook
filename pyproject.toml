[project]
name = "agent-costbook"
version = "1.0.0"
description = "Traceable costs and capabilities for AI agents"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2",
  "uvicorn>=0.32",
]

[project.urls]
Homepage = "https://github.com/JarvanAI/agent-costbook"
Repository = "https://github.com/JarvanAI/agent-costbook"
Issues = "https://github.com/JarvanAI/agent-costbook/issues"

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
]

[project.scripts]
agent-costbook-export = "agent_costbook.export:main"
agent-costbook-backup = "agent_costbook.backup:main"
agent-costbook-migrate = "agent_costbook.migrations:main"
ac = "agent_costbook.offline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = [
  "src",
  "tests",
  "examples",
  "skills",
  "README.md",
  "README.zh-CN.md",
  "LICENSE",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "AGENTS.md",
  "docs",
  "scripts",
  "pyproject.toml",
  "uv.lock",
  ".env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
